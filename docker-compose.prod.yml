name: trainsyt

services:
  trainsyt-api:
    image: ${DOCKERHUB_USERNAME:-comphortinoe}/trainsyt-server:${IMAGE_TAG:-latest}
    container_name: trainsyt-api
    env_file:
      - ${TRAINSYT_ENV_FILE:-.env.prod}
    expose:
      - "8000"
    networks:
      - trainsyt-net
    depends_on:
      trainsyt-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  trainsyt-postgres:
    image: postgres:16-alpine
    container_name: trainsyt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainsyt}
      POSTGRES_USER: ${POSTGRES_USER:-trainsyt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - trainsyt-postgres-data:/var/lib/postgresql/data
    networks:
      - trainsyt-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  trainsyt-nginx:
    image: nginx:1.29-alpine
    container_name: trainsyt-nginx
    ports:
      - "${TRAINSYT_HTTPS_PORT:-2096}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - trainsyt-net
    depends_on:
      trainsyt-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --no-check-certificate https://127.0.0.1/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  trainsyt-net:
    name: trainsyt-net
    driver: bridge

volumes:
  trainsyt-postgres-data:
    name: trainsyt-postgres-data
